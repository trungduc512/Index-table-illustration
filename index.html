<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Seed Benchmark Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <h2>Seed Benchmark Cumulative Time</h2>

    <!-- Form chỉnh config -->
    <form id="configForm">
      <label>
        Total Docs:
        <input type="number" id="totalDocs" />
      </label>
      <label>
        Batch Size:
        <input type="number" id="batchSize" />
      </label>
      <button type="submit">Update Config</button>
    </form>

    <canvas id="benchmarkChart" width="800" height="400"></canvas>

    <script>
      async function initializeConfigInputs() {
        // Lấy config từ backend
        const configRes = await fetch("http://localhost:3000/api/config");
        const configData = await configRes.json();

        // Set giá trị vào input (ví dụ lấy noIndex làm mặc định)
        document.getElementById("totalDocs").value =
          configData.noIndex.totalDocs;
        document.getElementById("batchSize").value =
          configData.noIndex.batchSize;
      }

      // Gọi hàm trước khi vẽ chart
      initializeConfigInputs().then(drawChart);

      async function drawChart() {
        const res = await fetch("http://localhost:3000/api/benchmarks");
        const data = await res.json();

        // Lấy config từ backend
        const configRes = await fetch("http://localhost:3000/api/config");
        const configData = await configRes.json();

        // Lấy batchSize từ config để tính tích lũy
        const batchSize =
          parseInt(document.getElementById("batchSize").value) ||
          configData.noIndex.batchSize;

        function cumulativeTimes(batchTimes) {
          let total = 0;
          return batchTimes.map((t) => (total += t));
        }

        function cumulativeRecords(batchTimes) {
          return batchTimes.map((_, i) => (i + 1) * batchSize);
        }

        const labels = cumulativeRecords(data.withIndex);

        const chartData = {
          labels,
          datasets: [
            {
              label: "With Index",
              data: cumulativeTimes(data.withIndex),
              borderColor: "blue",
              backgroundColor: "rgba(0,0,255,0.2)",
            },
            {
              label: "No Index",
              data: cumulativeTimes(data.noIndex),
              borderColor: "red",
              backgroundColor: "rgba(255,0,0,0.2)",
            },
          ],
        };

        const config = {
          type: "line",
          data: chartData,
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: "Cumulative Seed Time vs Number of Records (ms)",
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: "Total Time (ms)" },
              },
              x: {
                title: { display: true, text: "Number of Records Inserted" },
              },
            },
          },
        };

        const ctx = document.getElementById("benchmarkChart").getContext("2d");
        new Chart(ctx, config);
      }

      // Form submit: update config
      document
        .getElementById("configForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const totalDocs = parseInt(
            document.getElementById("totalDocs").value
          );
          const batchSize = parseInt(
            document.getElementById("batchSize").value
          );

          const res = await fetch("http://localhost:3000/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ totalDocs, batchSize }),
          });

          const data = await res.json();
          alert(`Config updated: ${JSON.stringify(data.config)}`);
        });

      drawChart(); // vẽ chart lúc load page
    </script>
  </body>
</html>
