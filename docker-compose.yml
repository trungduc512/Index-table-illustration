services:
  mongo:
    image: mongo:latest
    container_name: index-table-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - indextabledata:/data/db

volumes:
  indextabledata:
